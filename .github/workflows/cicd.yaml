name: Deploy FastAPI Docker Image to EC2

on:
  push:
    branches:
      - main

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove unnecessary packages
          sudo apt-get update
          sudo apt-get remove -y '^ghc-8.*' '^dotnet-.*' '^llvm-.*' 'php.*' mysql-server postgresql
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          # Clean Docker
          docker system prune -a -f --volumes
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: ECR_REGISTRY is empty"
            exit 1
          fi
          
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Building image: $IMAGE_URI"
          
          docker build --no-cache -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Clean up Docker after build
        if: always()
        run: |
          docker system prune -f
          docker image prune -a -f

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
      IMAGE_TAG: latest

    steps:
      - name: Free up disk space on self-hosted runner
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Clean Docker
          docker system prune -a -f --volumes
          docker image prune -a -f
          
          # Remove old images
          docker rmi $(docker images -f "dangling=true" -q) || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR credentials
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: Failed to login to ECR. ECR_REGISTRY is empty"
            exit 1
          fi
          echo "ECR_REGISTRY=[$ECR_REGISTRY]"
          echo "ECR_REPOSITORY=[$ECR_REPOSITORY]"
          echo "IMAGE_TAG=[$IMAGE_TAG]"

      - name: Pull latest Docker image from ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG || exit 1

      - name: Stop and remove old container
        run: |
          docker stop agentic-chatbot || true
          docker rm agentic-chatbot || true

      - name: Run new container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker run -d \
            --name agentic-chatbot \
            --restart always \
            -p 8080:8080 \
            -e GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
            -e GOOGLE_MODEL="${{ secrets.GOOGLE_MODEL }}" \
            -e TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            -e LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}" \
            -e LANGSMITH_ENDPOINT="${{ secrets.LANGSMITH_ENDPOINT }}" \
            -e LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
            -e LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Verify container is running
        run: |
          sleep 2
          docker ps | grep agentic-chatbot || (echo "Container failed to start"; docker logs agentic-chatbot; exit 1)

      - name: Clean unused Docker images
        if: always()
        run: |
          docker system prune -f --volumes
          docker image prune -a -f
          docker volume prune -f